services:
  - type: web
    name: telegram-refer-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        value: "7652741479"
      - key: DATABASE_URL
        fromDatabase:
          name: telegram-refer-db
          property: connectionString
      - key: WEBHOOK_SECRET
        sync: false
      - key: WEBHOOK_BASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.13.5"

databases:
  - name: telegram-refer-db
    plan: free
